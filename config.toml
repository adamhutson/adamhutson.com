baseURL = "https://adamhutson.com/"
defaultContentLanguage = "en"
languageCode = "en"
title = "Adam Hutson"
theme = "LoveIt"

[params]
  version = "0.1.X"
  [params.footer]
    since = 2009
  [params.home]
    [params.home.profile]
      enable = true
      avatarURL = "/images/AdamHutson-Headshot-512x512.jpg"
      subtitle = "Data Architect and DataOps Engineer"
      social = true
  [params.social]
    GitHub = "adamhutson"
    Linkedin = "adamhutson"
    Twitter = "adamhutson"
    Instagram = "adamhutson"
    Email = "adam.hutson@yahoo.com"
    Facebook = "hootsawn"
    Slidershare = "adamhutson"
  [params.page]
    lightgallery = true
    linkToMarkdown = true
  [params.share]
    enable = true
    Twitter = true
    Facebook = true
    Linkedin = true
  [params.comment]
    enable = true
    
[menu]
  [[menu.main]]
    identifier = "posts"
    # you can add extra information before the name (HTML format is allowed), such as icons
    pre = ""
    name = "Posts"
    url = "/posts/"
    # title will be shown when you hover on this menu link
    title = ""
    weight = 1
  [[menu.main]]
    identifier = "talks"
    pre = ""
    name = "Talks"
    url = "/talks/"
    title = ""
    weight = 2
  [[menu.main]]
    identifier = "resume"
    pre = ""
    name = "Resume"
    url = "/resume/"
    title = ""
    weight = 3

[author]
  name = "Adam"
# asciidoctor renders the .adoc posts. Hugo's default exec policy does not
# whitelist it, and without this the AsciiDoc bodies are silently dropped
# while the build still reports success.
[security.exec]
  allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^npx$', '^postcss$', '^asciidoctor$']
