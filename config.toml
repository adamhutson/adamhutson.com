baseURL = "http://adamhutson.com/"
languageCode = "en-us"
title = "Adam Hutson"
theme = "hugo-coder"

paginate = 20
canonifyurls = true

pygmentsstyle = "b2"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[params]
    author = "Adam Hutson"
    description = "Adam Hutson's personal website"
    keywords = "blog,developer,personal"
    info = "Data Architect and DevOps "
    avatarurl = "images/AdamHutson-Headshot-512x512.jpg"
    #footercontent = "Jump and grow wings on the way down"

    dateformat = "January 2, 2006"

    hideCredits = true
    hideCopyright = true

    # Git Commit in Footer, uncomment the line below to enable it.
    #commit = "https://github.com/luizdepra/hugo-coder/tree/"

    rtl = false

    # Use inverted colors
    inverted = true

    # Series see also post count
    maxSeeAlsoItems = 5

    # Custom CSS
    custom_css = []
    
    # Custom JS
    custom_js = []

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

[[params.social]]
    name = "Github"
    icon = "fab fa-github"
    weight = 1
    url = "https://github.com/adamhutson/"
[[params.social]]
    name = "Twitter"
    icon = "fab fa-twitter"
    weight = 2
    url = "https://twitter.com/adamhutson/"
[[params.social]]
    name = "LinkedIn"
    icon = "fab fa-linkedin"
    weight = 3
    url = "https://www.linkedin.com/in/adamhutson/"

[languages]
    [languages.en]
        languagename = "English"

        [languages.en.menu]

            [[languages.en.menu.main]]
            name = "About"
            weight = 1
            url = "about/"

            [[languages.en.menu.main]]
            name = "Blog"
            weight = 2
            url = "posts/"

            [[languages.en.menu.main]]
            name = "Resume"
            weight = 3
            url = "resume/"

            [[languages.en.menu.main]]
            name = "Talks"
            weight = 4
            url = "talks/"

            [[languages.en.menu.main]]
            name = "Contact"
            weight = 5
            url = "contact/"
