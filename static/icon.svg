    <rect x="17.6" y="36" width="10.8" height="4.4"/>
    <!-- H -->
    <rect x="36" y="17" width="5.4" height="30"/>
    <rect x="47.4" y="17" width="5.4" height="30"/>
    <rect x="36" y="29.8" width="16.8" height="4.4"/>
  </g>
</svg>
