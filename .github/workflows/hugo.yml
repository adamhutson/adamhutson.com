name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned deliberately. The LoveIt theme is from 2020 and does not build on
      # current Hugo: it calls _internal/google_analytics_async.html and reads
      # .Site.Author and .Site.IsMultiLingual, all since removed. 0.120.4 is the
      # newest version that builds this site. Do not bump without rebuilding and
      # diffing the output.
      HUGO_VERSION: 0.120.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -qO /tmp/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb

      # Required: several posts and the Talks page are AsciiDoc. Without this
      # the build still succeeds and silently drops their content.
      - name: Install asciidoctor
        run: sudo apt-get install -y asciidoctor

      # No configure-pages step on purpose. baseURL comes from config.toml, so
      # nothing here needs its output, and leaving it out lets pull requests
      # build even before Pages is enabled on this repo.
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc 2>&1 | tee build.log

      # A missing asciidoctor does not fail the build, it just quietly drops
      # the AsciiDoc bodies. Catch that here instead of shipping empty pages.
      - name: Fail if AsciiDoc pages came out empty
        run: |
          if grep -q "AsciiDoc content unrendered" build.log; then
            echo "asciidoctor did not run; AsciiDoc bodies were dropped." >&2
            exit 1
          fi
          grep -q "Cassandra Summit" public/talks/index.html || {
            echo "Talks page is missing its AsciiDoc content." >&2; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Pull requests build only. Deploying is limited to master.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
